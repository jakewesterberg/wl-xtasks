# Registered as wl-bhvtasks until 2026-08-30, and as wl-bhveval and wl-bhvtask
# before that. The registry carries all three as aliases, so wl-preproc's design
# spec naming `{matlab, psychtoolbox, wl-bhvtask}` as the behavioural stack, and
# every other older reference, still resolve here.
schema: 1
slug: wl-mllib
class: experiment
lifecycle: scaffolded
visibility: private
remote: https://github.com/jakewesterberg/wl-mllib.git

summary: >-
  The MonkeyLogic task library: the behavioural tasks animals perform in
  experiments, plus the event-code allocation needed to decode their output.
  wl-preproc reads event handling from here rather than defining it; wl-works
  renders a page per task. wl-shook and wl-juicer are devices these tasks drive.

# No runs_on, builds_on or third_party. The repository holds no code yet, and
# wl-preproc's own design says the behavioural stack is unchosen — declaring
# MATLAB and Psychtoolbox here would assert a toolchain nothing has committed to.

publishes:
  - name: task-event-vocabulary
    kind: event-code-allocation
    stability: planned
    what: >-
      Which numeric event code means what, allocated once here so every reader
      decodes the same way. wl-preproc reads event handling from here rather
      than defining it, and wl-expviz needs it to label trials — a recorded code
      carries timing without it, and no meaning. Nothing is allocated yet.

consumes:
  - name: session-id
    why: >-
      A task runs inside a session the sync box minted, and its recorded events
      are only interpretable against that identity. The fuller interface — how
      event lines reach the sync box's GPIO, and what the tasks receive back —
      is not settled, so only this is declared.
