# wl-xtasks since 2026-09-28. Named wl-exptasks from 2026-09-26 until then,
# wl-mllib from 2026-08-30 before that, registered as wl-bhvtasks before that,
# and as wl-bhveval and wl-bhvtask before that. The registry carries all five
# as aliases, so wl-preproc's design spec naming `{matlab, psychtoolbox,
# wl-bhvtask}` as the behavioural stack, and every other older reference,
# still resolve here.
#
# "ml" was MonkeyLogic, and the lab does not run it: wl-xcon's ADR-0005 made
# that controller the day-one stack, with no maintained MonkeyLogic task
# twins. It also read as machine learning. wl-xcon is what wl-expcontroller
# was renamed to on 2026-09-28, alongside this package and wl-expviz.
schema: 1
slug: wl-xtasks
class: experiment
lifecycle: scaffolded
# Public since 2026-11-07, by the PI's choice.
visibility: public
remote: https://github.com/jakewesterberg/wl-xtasks.git

summary: >-
  The experiment task library: the behavioural tasks animals perform, on the
  recording rigs and on wl-touchtrain's cage-side kiosk, written in
  wl-xcon's task-definition format, plus the event-code allocation
  needed to interpret their output. wl-preproc decodes those codes; wl-works
  renders a page per task. wl-juicer delivers the rewards these tasks command.

# No runs_on, builds_on or third_party. The tasks run inside wl-xcon, whose own
# manifest declares what it runs on, and the first, tasks/popout_search.py
# (2026-11-07), needs nothing beyond it: its colors are plain data (stimuli/).

requires:
  - name: wl-xcon
    for: the task-definition format its tasks are written in, and the engine that runs them
    why: >-
      Each task is a Python file declaring one Task in wl-xcon's task-definition
      format, imported from wl_xcon, and checked, reviewed and run by wl-xcon, which
      reads it by its path until its library pull exists (wl-xcon's XC-150).
      Unpinned: a task is read by the wl-xcon that runs it, never installed against
      a version of it.

publishes:
  - name: task-event-vocabulary
    kind: event-code-allocation
    stability: planned
    what: >-
      Which numeric event code means what, in the ranges this package owns:
      TaskEvent 256-4095 (lab-wide task-event semantics), TaskTypeCode 100+
      (lab-defined task identities) and 4096-32767 (task-specific and condition
      encoding). Allocated once here so every reader decodes the same way, and
      wl-xviz needs it to label trials — a recorded code carries timing
      without it, and no meaning.

      This entry previously claimed the whole vocabulary and said nothing was
      allocated. Both were false: wl-preproc's wl_preproc/contracts/events.py
      is a frozen interface owning the framing, the escapes, the checksum, the
      DVA encoding and Marker 1-255, and it carries real allocations. Corrected
      2026-08-31 per wl-xcon ADR-0007, which splits ownership on
      decodability versus meaning — undecodable is wl-preproc's, uninterpretable
      is this package's.

      wl-preproc agreed on 2026-09-01 that TaskEvent 256-4095 is this package's
      (their docs/CHECKPOINT.md, and the `consumes` entry in their wl.yaml). The
      256-259 they had already allocated transfer as allocated and are never
      renumbered; they stay mirrored in their events.py until this package
      ships its own. Nothing else is allocated here yet: wl-xcon's
      reference allocation, in 4096-32767, lives in its tasks/allocation.py
      until it moves here.

consumes:
  - name: session-id
    why: >-
      A task runs inside a session the sync box minted, and its recorded events
      are only interpretable against that identity. The fuller interface — how
      event lines reach the sync box's GPIO, and what the tasks receive back —
      is not settled, so only this is declared.
  - name: event-code-protocol
    why: >-
      Every code allocated here is carried in wl-preproc's 16-bit strobed
      framing, whose escapes, checksum and Marker 1-255 are theirs. An
      allocation that ignores the framing is undecodable however well it is
      named. This edge waited until wl-preproc published the protocol as an
      artifact, which it now does.
